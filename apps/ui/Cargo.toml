[package]
name = "vds-admin"
description = "VDS Admin — infrastructure, website and analytics monitoring."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints.rust]
# See the note in src/main.rs: the Slint-generated module needs `allow(unsafe_code)`.
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[[bin]]
name = "vds-admin"
path = "src/main.rs"

# --- Android ---------------------------------------------------------------------
#
# Read by `cargo-apk` to generate the manifest. Kept here rather than in a hand-written
# AndroidManifest.xml so that the permissions live next to the code that needs them.

[package.metadata.android]
package = "dev.vdsadmin.app"
apk_name = "vds-admin"
# Portrait and landscape both work; the layout reflows at 768px.
resizeable_activity = true

[package.metadata.android.sdk]
# 24 is Android 7.0. Below that the Slint renderer's requirements stop being met, and
# the population still on it is not worth the compatibility shims.
min_sdk_version = 24
target_sdk_version = 34
compile_sdk_version = 34

# The application exists to reach servers over the network. Without this the APK installs
# and then fails every connection.
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

# Lets the app tell "the server is down" from "this phone has no connection", which are
# very different things to show a user at two in the morning.
[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

# Android 13 and later require this to be requested for notifications to appear at all.
[[package.metadata.android.uses_permission]]
name = "android.permission.POST_NOTIFICATIONS"

[features]
# Fabricated analytics and placeholder screenshots, so the interface can be exercised
# with nothing configured. Never enabled in a release build.
demo-providers = ["vds-composition/demo-providers"]

[dependencies]
vds-domain.workspace = true
vds-application.workspace = true
vds-composition.workspace = true

async-trait.workspace = true
chrono.workspace = true
slint = { workspace = true, features = ["backend-winit", "renderer-software"] }
copypasta = "0.10"
image.workspace = true
tokio = { workspace = true }
tokio-util.workspace = true
tracing.workspace = true

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
vds-application = { workspace = true, features = ["testing"] }
