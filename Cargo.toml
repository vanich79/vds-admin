[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/agent-protocol",
    "crates/application",
    "crates/infra-db",
    "crates/infra-ssh",
    "crates/infra-collectors",
    "crates/infra-web",
    "crates/infra-analytics",
    "crates/infra-screenshot",
    "crates/infra-secrets",
    "crates/infra-notify",
    "crates/composition",
    "apps/ui",
    "agent",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/vds-admin/vds-admin"
authors = ["VDS Admin contributors"]

[workspace.dependencies]
# --- internal ---
vds-domain = { path = "crates/domain" }
vds-agent-protocol = { path = "crates/agent-protocol" }
vds-application = { path = "crates/application" }
vds-infra-db = { path = "crates/infra-db" }
vds-infra-ssh = { path = "crates/infra-ssh" }
vds-infra-collectors = { path = "crates/infra-collectors" }
vds-infra-web = { path = "crates/infra-web" }
vds-infra-analytics = { path = "crates/infra-analytics" }
vds-infra-screenshot = { path = "crates/infra-screenshot" }
vds-infra-secrets = { path = "crates/infra-secrets" }
vds-infra-notify = { path = "crates/infra-notify" }
vds-composition = { path = "crates/composition" }

# --- core ---
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
futures = "0.3"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "fs", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4", "serde"] }

# --- observability ---
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# --- infrastructure ---
argon2 = "0.5"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
hex = "0.4"
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }
# The agent terminates TLS itself, so it drives hyper directly rather than through
# `axum::serve`, which has no TLS story.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
# The formats that turn up in a web root. Enabled explicitly rather than by default:
# `image` otherwise pulls in decoders for scientific formats nobody serves.
image = { version = "0.25", default-features = false, features = [
    "png", "jpeg", "gif", "bmp", "webp", "ico",
] }
keyring = "4"
notify-rust = "4"
rand = "0.9"
# Self-signed certificate generation for the agent's first start. Pure Rust on `ring`,
# so it cross-compiles to every ARM target without a toolchain hunt for OpenSSL.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rustls-pemfile = "2"
# `rustls-no-provider` keeps aws-lc-rs (and its cmake/nasm build requirements) out of
# the tree; the process installs `ring` as the default provider instead, which is far
# easier to cross-compile for ARM and Android.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "webpki-roots", "json", "gzip", "charset", "http2", "query"] }
rusqlite = { version = "0.40", features = ["bundled", "chrono", "backup"] }
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "0.9"
url = "2"
webpki-roots = "1"
x509-parser = "0.18"
zeroize = { version = "1", features = ["derive"] }

# --- ui ---
slint = { version = "1.17", default-features = false, features = ["compat-1-2", "std"] }
slint-build = "1.17"

# --- dev ---
tempfile = "3"
wiremock = "0.6"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# The agent is optimised harder for size: it lives on other people's servers.
[profile.agent-release]
inherits = "release"
opt-level = "z"
lto = "fat"

[profile.dev]
opt-level = 0
debug = 1
