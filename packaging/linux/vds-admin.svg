<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="VDS Admin">
  <title>VDS Admin</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="13" fill="url(#bg)"/>

  <!-- Three stacked servers, the thing the application is about. -->
  <g fill="#374151" stroke="#4b5563" stroke-width="1.2">
    <rect x="13" y="14" width="38" height="10" rx="2.5"/>
    <rect x="13" y="27" width="38" height="10" rx="2.5"/>
    <rect x="13" y="40" width="38" height="10" rx="2.5"/>
  </g>

  <!-- Status lamps: healthy, healthy, warning. -->
  <circle cx="19.5" cy="19" r="2.2" fill="#22c55e"/>
  <circle cx="19.5" cy="32" r="2.2" fill="#22c55e"/>
  <circle cx="19.5" cy="45" r="2.2" fill="#f59e0b"/>

  <!-- A load trace across the stack, so the icon reads as monitoring rather than storage. -->
  <polyline points="26,20 30,20 33,16.5 36,22 39,18 43,20 47,20"
            fill="none" stroke="#60a5fa" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="26,33 31,33 34,30 37,35 41,31 47,33"
            fill="none" stroke="#60a5fa" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
  <polyline points="26,46 30,46 34,42 38,48 42,44 47,46"
            fill="none" stroke="#f59e0b" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
