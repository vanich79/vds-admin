name: Release

# Triggered by a version tag. Everything it publishes is built here, in this run, from
# the tagged commit — no artefact is ever uploaded from a developer's machine.
#
#   git tag -a v0.2.0 -m "..." && git push origin v0.2.0

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (must already exist)
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # A tag must not be able to ship code that would fail CI. The whole suite runs first,
  # and everything below depends on it.
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  # --- desktop --------------------------------------------------------------------------
  desktop:
    name: Desktop (${{ matrix.os }})
    needs: [verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: build-linux.sh --formats tar,deb,appimage
            artefacts: dist/linux
          - os: windows-latest
            script: build-windows.sh --installer
            artefacts: dist/windows
          - os: macos-latest
            script: build-macos.sh
            artefacts: dist/macos
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libfontconfig1-dev libxkbcommon-dev
          cargo install cargo-deb --locked

      # Extracted rather than run as an AppImage. GitHub's runners have no libfuse2, so
      # the tool cannot mount itself; unpacking it once sidesteps the whole question.
      - name: Install appimagetool
        if: runner.os == 'Linux'
        run: |
          url=https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          curl -fsSL -o appimagetool.AppImage "$url"
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract > /dev/null
          sudo mv squashfs-root /opt/appimagetool
          sudo ln -sf /opt/appimagetool/AppRun /usr/local/bin/appimagetool
          rm appimagetool.AppImage
          # No version check: the tool's flags vary between builds, and a release must
          # not fail because a diagnostic command was spelled differently this month.
          test -x /opt/appimagetool/AppRun

      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --no-progress -y
        shell: pwsh

      - name: Build
        shell: bash
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
        run: bash scripts/${{ matrix.script }}

      # The `.app` is a directory, and a wildcard walks into it: the last draft carried
      # a loose `Info.plist` and a bare 41 MB `vds-admin` binary as release assets,
      # alongside the .dmg that already contains both. Only the installers ship.
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            ${{ matrix.artefacts }}/*
            !${{ matrix.artefacts }}/*.app
          # A hand-off to the publish job, nothing more: once the release carries
          # these files the copy in the artifact store is dead weight.
          retention-days: 1
          if-no-files-found: error

  # --- agent, one job per architecture ---------------------------------------------------
  agent:
    name: Agent (${{ matrix.short }})
    needs: [verify]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { short: x86_64,  target: x86_64-unknown-linux-musl }
          - { short: aarch64, target: aarch64-unknown-linux-musl }
          - { short: armv7,   target: armv7-unknown-linux-musleabihf }
          - { short: armv6,   target: arm-unknown-linux-musleabihf }
          - { short: i686,    target: i686-unknown-linux-musl }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build and package
        run: bash scripts/build-agent.sh ${{ matrix.short }}

      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.short }}
          path: dist/agent/vds-agent-${{ matrix.target }}.tar.gz
          retention-days: 1
          if-no-files-found: error

  # --- Android ---------------------------------------------------------------------------
  android:
    name: Android APK
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install the NDK and the SDK platform
        # The same three as CI, and for the same reason: the NDK alone is not enough,
        # because cargo-apk links against a platform and calls the build tools. This job
        # asked for the NDK only, so a release build could fail on a runner where CI had
        # passed — the one difference no one would think to look for.
        run: |
          sdkmanager --install "ndk;26.3.11579264" \
                               "platforms;android-34" \
                               "build-tools;34.0.0"

      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-apk --locked

      # Shared with CI, by the same key, so an APK from a release installs over one from
      # a CI run rather than demanding an uninstall that deletes the user's data.
      - name: Keep the debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Restore the signing keystore
        # Without a keystore the build script produces a debug APK and says so, rather
        # than an unsigned release APK that nobody can install.
        #
        # The secret is read through `env` rather than tested in `if`. GitHub does not
        # provide the `secrets` context to a step condition, and using it there does not
        # skip the step — it rejects the whole file, which is why every release run here
        # failed in a second with no jobs at all.
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "no signing keystore configured; the build will produce a debug APK"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
          # Both names, and they must agree. cargo-apk reads ANDROID_NDK_ROOT;
          # skia-bindings reads ANDROID_NDK and otherwise finds whichever NDK the
          # runner ships. That mismatch compiled Skia against a 27.3 sysroot with a
          # 26.3 clang — a combination nobody chose and nobody tests.
          ANDROID_NDK: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: bash scripts/build-android.sh --release

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/android/*.apk
          retention-days: 1
          if-no-files-found: error

  # --- collect, checksum and publish --------------------------------------------------------
  publish:
    name: Publish
    needs: [desktop, agent, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Only what the release jobs built. Without a pattern this downloads every
      # artefact in the run, and the verification stage is a whole CI run: it uploads
      # `android-debug-apk` and `linux-appimage` of its own. Those went straight into
      # the release — four debug APKs, nearly two gigabytes, beside the twelve-megabyte
      # signed ones they were meant to replace. It was invisible until the release APKs
      # got their own names; before that the two sets overwrote each other file for file.
      - uses: actions/download-artifact@v4
        with:
          path: staging
          pattern: '{desktop-*,agent-*,android}'

      - name: Collect the artefacts
        run: |
          mkdir -p release
          # Each job's artefacts arrive in their own directory; flatten them, and drop
          # the per-job SHA256SUMS files — one authoritative list is generated below.
          find staging -type f ! -name 'SHA256SUMS' -exec cp {} release/ \;
          ls -lh release

      - name: Publish the installer alongside the tarballs
        # So that `curl .../install.sh | sudo sh` resolves without unpacking anything.
        run: cp packaging/agent/install.sh release/install.sh

      - name: Generate SHA256SUMS
        # One file covering every artefact in the release. The agent installer verifies
        # against exactly this, which is why it is generated here rather than merged
        # from the per-job lists.
        run: |
          cd release
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS
        # Signed with a key that never touches a build machine, so a compromised runner
        # cannot produce a matching pair of artefacts and signature. Optional: without
        # the secret the release still carries checksums, and docs/AGENT.md describes
        # what that does and does not protect against.
        # Tested inside the script, not in `if`: the `secrets` context is not available
        # to a step condition, and naming it there invalidates the workflow file.
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_SIGNING_KEY" ]; then
            echo "no signing key configured; the release carries checksums without a signature"
            exit 0
          fi
          echo "$GPG_SIGNING_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --armor --detach-sign --output release/SHA256SUMS.asc release/SHA256SUMS
          gpg --verify release/SHA256SUMS.asc release/SHA256SUMS

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: release/*
          draft: true
          generate_release_notes: true
          body: |
            ## Verifying a download

            Every artefact is listed in `SHA256SUMS`:

            ```sh
            sha256sum --check SHA256SUMS --ignore-missing
            ```

            When `SHA256SUMS.asc` is present, check the signature first — that is what
            protects you if this release host is ever compromised:

            ```sh
            gpg --verify SHA256SUMS.asc SHA256SUMS
            ```

            ## Installing the agent

            ```sh
            curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sudo sh
            ```

            See [docs/AGENT.md](docs/AGENT.md) for the verified offline installation
            path, which is the right one for a production fleet.
