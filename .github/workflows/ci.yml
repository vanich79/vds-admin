name: CI

# Runs on every push and pull request. The release workflow does not repeat these checks
# — it depends on this one — so a tag can never ship code that has not passed them.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  # A CI failure should be reproducible; a warning that only appears on the runner is a
  # failure waiting to reach a user.
  RUSTFLAGS: -D warnings
  # Full backtraces make a failing test on a runner diagnosable without re-running it.
  RUST_BACKTRACE: 1

jobs:
  # --- fast checks, first, so an obvious mistake fails in under a minute -------------
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install the GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libfontconfig1-dev libxkbcommon-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo lint

      - name: Check the dependency rule
        run: bash scripts/check-layering.sh

      - name: Shell scripts
        run: |
          sudo apt-get install --no-install-recommends -y shellcheck
          shellcheck scripts/*.sh packaging/agent/install.sh

  # --- the test suite, on every platform the application ships to ---------------------
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install the GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libfontconfig1-dev libxkbcommon-dev

      # `--all-features` so the demo providers are compiled and tested. They are never
      # shipped, but code that is never built is code that has already rotted.
      - name: Test
        run: cargo test --workspace --all-features

      - name: Test the release profile
        # The release profile turns on LTO and `panic = "abort"`. A test suite that only
        # ever runs in debug will not notice a difference those introduce.
        if: runner.os == 'Linux'
        run: cargo test --workspace --release

  # --- the agent's cross-compilation matrix -------------------------------------------
  agent:
    name: Agent (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - i686-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build
        run: cross build --profile agent-release --target ${{ matrix.target }} --package vds-agent

      - name: Check the size
        # The agent is installed on machines with 512 MB of RAM and a metered link. A
        # binary that quietly triples in size is a regression worth failing over.
        run: |
          size=$(stat -c%s target/${{ matrix.target }}/agent-release/vds-agent)
          echo "vds-agent is $((size / 1024)) KiB"
          if [ "$size" -gt 8388608 ]; then
            echo "::error::the agent binary exceeds 8 MiB"
            exit 1
          fi

  # --- the desktop application builds on every platform --------------------------------
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install the GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libfontconfig1-dev libxkbcommon-dev

      - name: Build
        run: cargo build --release --package vds-admin

      # Packaged on every run, not only on a tag. An AppImage that is only produced by a
      # release is one nobody tries until the release, which is the worst moment to
      # discover it does not start.
      #
      # Extracted rather than executed: the runners have no libfuse2, so appimagetool
      # cannot mount itself.
      - name: Install appimagetool
        if: runner.os == 'Linux'
        run: |
          url=https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          curl -fsSL -o appimagetool.AppImage "$url"
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract > /dev/null
          sudo mv squashfs-root /opt/appimagetool
          sudo ln -sf /opt/appimagetool/AppRun /usr/local/bin/appimagetool
          rm appimagetool.AppImage

      - name: Package the AppImage
        if: runner.os == 'Linux'
        run: bash scripts/build-linux.sh --formats tar,appimage

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: linux-appimage
          path: dist/linux/*
          # Without this the upload keeps the repository default, which is 90 days, and
          # every push to main leaves a full set of Linux bundles behind. That is what
          # filled the account's storage; the APK beside it already had a limit.
          retention-days: 7
          if-no-files-found: error
          retention-days: 30

  # --- the Android APK ------------------------------------------------------------------
  android:
    name: Android
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install the NDK and the SDK platform
        # The NDK alone is not enough: cargo-apk links against a platform and calls the
        # build tools, and the runner ships neither. "Platform `30` is not installed" is
        # what their absence looks like.
        run: |
          sdkmanager --install "ndk;26.3.11579264" \
                               "platforms;android-34" \
                               "build-tools;34.0.0"

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      # The signing key, kept between runs. Without this each build gets a new one, and
      # Android will not install an APK over a version signed by a different key — the
      # user has to uninstall first, which deletes their servers, sites and credentials.
      # A cache rather than a secret because a debug key is not one: it can sign debug
      # builds of this application and nothing else.
      - name: Keep the debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Build the APK
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
          # Both names, and they must agree. cargo-apk reads ANDROID_NDK_ROOT;
          # skia-bindings reads ANDROID_NDK and otherwise finds whichever NDK the
          # runner ships. That mismatch compiled Skia against a 27.3 sysroot with a
          # 26.3 clang — a combination nobody chose and nobody tests.
          ANDROID_NDK: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
        # Every ABI the release builds, so that "CI is green" means the release will
        # build. One ABI was cheaper and let a 32-bit compilation failure through to the
        # release, which is the worst moment to find one: the desktop builds all
        # succeeded and were thrown away.
        run: bash scripts/build-android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: dist/android/*.apk
          retention-days: 7
