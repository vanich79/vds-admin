[package]
name = "vds-application"
description = "Use cases, schedulers and engines. Depends on the domain and its ports only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[features]
# In-memory fakes for every port, so downstream crates can test against them too.
testing = []

[dependencies]
vds-domain.workspace = true

async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true }
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true

# NOTE: no rusqlite, russh, reqwest or slint here either. This layer talks to ports.

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
